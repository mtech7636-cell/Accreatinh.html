<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAME TURBO</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #111; padding: 30px; border-radius: 20px; box-shadow: 0 0 15px #ff3c00; width: 320px; text-align: center; border: 1px solid #222; }
        h1 { color: #ff3c00; margin: 0; font-size: 28px; }
        .sub { color: #666; font-size: 12px; margin-bottom: 20px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 15px; background: #ff3c00; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; font-size: 16px; }
        #status { margin-top: 15px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>FLAME TURBO</h1>
        <div class="sub">Rank • Cars • Cash • Coin</div>
        <select id="game">
            <option value="CPM1">CPM 1 (Classic)</option>
            <option value="CPM2">CPM 2 (New)</option>
        </select>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="start()">ACTIVATE</button>
        <div id="status"></div>
    </div>

    <script>
        async function start() {
            const status = document.getElementById('status');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const game = document.getElementById('game').value;

            if(!email || !password) { status.innerText = "❌ Details missing!"; return; }
            status.style.color = "orange";
            status.innerText = "⏳ Injecting...";

            const res = await fetch('/unlock', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password, game })
            });
            const result = await res.json();
            status.style.color = result.status === "success" ? "#0f0" : "#f00";
            status.innerText = result.message;
        }
    </script>
</body>
</html>
