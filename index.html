<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAME TURBO | UNLOCKER</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px #ff3c00;
            width: 90%;
            max-width: 340px;
            text-align: center;
            border: 1px solid #222;
        }
        h2 { color: #ff3c00; margin-bottom: 5px; text-transform: uppercase; }
        .desc { font-size: 11px; color: #666; margin-bottom: 20px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff3c00, #ff7b00);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.02); }
        #status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>FLAME TURBO</h2>
        <div class="desc">LOGIN • KING RANK • ALL CARS • CASH</div>
        
        <select id="game">
            <option value="CPM1">CPM 1 (Classic)</option>
            <option value="CPM2">CPM 2 (New)</option>
        </select>
        
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        
        <button id="btn" onclick="startUnlock()">ACTIVATE NOW</button>
        
        <div id="status"></div>
    </div>

    <script>
        const API_KEYS = {
            "CPM1": "AIzaSyAe_aOVT1gSfmHKBrorFvX4fRwN5nODXVA",
            "CPM2": "AIzaSyCQDz9rgjgmvmFkvVfmvr2-7fT4tfrzRRQ"
        };

        const URLS = {
            "CPM1": "https://us-central1-cp-multiplayer.cloudfunctions.net/SetUserRating4",
            "CPM2": "https://us-central1-cpm-2-7cea1.cloudfunctions.net/SetUserRating17_AppI"
        };

        async function startUnlock() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const game = document.getElementById('game').value;

            if(!email || !password) {
                status.style.color = "red";
                status.innerText = "❌ Fill all fields!";
                return;
            }

            btn.disabled = true;
            status.style.color = "orange";
            status.innerText = "⏳ Processing...";

            try {
                // 1. Login Logic
                const authRes = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEYS[game]}`, {
                    method: 'POST',
                    body: JSON.stringify({ email, password, returnSecureToken: true })
                });
                const authData = await authRes.json();

                if (authData.idToken) {
                    // 2. Injection Logic
                    const payload = {
                        data: JSON.stringify({
                            RatingData: { money: 50000000, coin: 50000, race_win: 5000, time: 10000000000 },
                            LocalData: { money: 50000000, coin: 50000, owned_cars: Array.from({length: 180}, (_, i) => i + 1), unlock_all_cars: true }
                        })
                    };

                    const injectRes = await fetch(URLS[game], {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authData.idToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (injectRes.ok) {
                        status.style.color = "#00ff00";
                        status.innerText = "👑 SUCCESS! RESTART GAME.";
                    } else {
                        status.style.color = "red";
                        status.innerText = "❌ Injection Failed.";
                    }
                } else {
                    status.style.color = "red";
                    status.innerText = "❌ Invalid Login!";
                }
            } catch (e) {
                status.style.color = "red";
                status.innerText = "❌ Connection Error!";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
